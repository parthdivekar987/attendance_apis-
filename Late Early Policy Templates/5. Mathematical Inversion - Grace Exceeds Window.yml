info:
  name: 5. Mathematical Inversion - Grace Exceeds Window
  type: http
  seq: 6

http:
  method: POST
  url: https://uatmcdphcmplatform.omfysgroup.com/api/attendance/late-early-policies/create
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "policyCode": null,
        "policyName": "Math Inversion Policy Test",
        "description": "Testing grace minutes (45) greater than event count minutes (30)",
        "templateMode": "CUSTOM",
        "eventCountMinutes": 30,
        "graceMinutes": 45,
        "graceEvent": 2,
        "allowedEvent": 3,
        "deductionType": "LEAVE",
        "leaveDeductDays": 0.50,
        "leaveTypeId": 1,
        "effectiveFrom": "2027-01-01",
        "effectiveTo": "2027-12-31",
        "isDefault": "N",
        "isActive": "Y",
        "assignments": [
          {
            "employeeId": 3585,
            "effectiveFrom": "2027-01-01",
            "effectiveTo": "2027-12-31",
            "isActive": "Y"
          }
        ]
      }
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        console.log("Status:", res.getStatus());
        console.log("Response:", JSON.stringify(res.getBody(), null, 2));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5