info:
  name: 4. Get All Policies Paginated
  type: http
  seq: 5

http:
  method: GET
  url: https://uatmcdphcmplatform.omfysgroup.com/api/attendance/late-early-policies/getAll?page=0&size=10&sort=policyId,desc
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        console.log("Status:", res.getStatus());
        console.log("Response:", JSON.stringify(res.getBody(), null, 2));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5