info:
  name: 1. Create Custom Policy - LEAVE (Happy Path)
  type: http
  seq: 2

http:
  method: POST
  url: https://uatmcdphcmplatform.omfysgroup.com/api/attendance/late-early-policies/create
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "policyCode": null,
        "policyName": "Custom Late Early Policy 2027",
        "description": "Custom policy with verified CL and PL leave deductions",
        "templateMode": "CUSTOM",
        "eventCountMinutes": 30,
        "graceMinutes": 10,
        "graceEvent": 2,
        "allowedEvent": 3,
        "deductionType": "LEAVE",
        "leaveDeductDays": 0.50,
        "leaveTypeId": 1,
        "fineAmount": null,
        "effectiveFrom": "2027-01-01",
        "effectiveTo": "2027-12-31",
        "isDefault": "N",
        "isActive": "Y",
        "remarks": "Verified leave types integration",
        "deductionPriorities": [
          {
            "priorityOrder": 1,
            "leaveTypeId": 1,
            "isActive": "Y"
          },
          {
            "priorityOrder": 2,
            "leaveTypeId": 2,
            "isActive": "Y"
          }
        ],
        "assignments": [
          {
            "employeeId": 3502,
            "effectiveFrom": "2027-01-01",
            "effectiveTo": "2027-12-31",
            "isActive": "Y"
          }
        ]
      }
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const resData = res.getBody();
        if (resData && resData.status === "success" && resData.data && resData.data.policyId) {
            bru.setVar("policyId", resData.data.policyId);
            bru.setEnvVar("policyId", resData.data.policyId);
            console.log("âœ” Saved policyId:", resData.data.policyId);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5