runtime:
  scripts:
    - type: after-response
      code: |-
        const resData = res.getBody();
        console.log("Status Code:", res.getStatus());
        console.log("Response Body:", JSON.stringify(resData, null, 2));
        if (resData && resData.status === "success" && resData.data && resData.data.holidayTemplateId) {
            bru.setVar("holidayTemplateId", resData.data.holidayTemplateId);
            bru.setEnvVar("holidayTemplateId", resData.data.holidayTemplateId);
            console.log("âœ” Saved holidayTemplateId:", resData.data.holidayTemplateId);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5