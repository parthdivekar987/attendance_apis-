info:
  name: Change Holiday Template Status
  type: http
  seq: 5

http:
  method: PATCH
  url: https://uatmcdphcmplatform.omfysgroup.com/api/attendance/holiday-templates/126/status
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "isActive": "N"
      }
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        console.log("Status:", res.getStatus());
        console.log("Response:", JSON.stringify(res.getBody(), null, 2));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5