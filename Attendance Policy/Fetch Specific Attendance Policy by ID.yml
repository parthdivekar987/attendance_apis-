info:
  name: Fetch Specific Attendance Policy by ID
  type: http
  seq: 3

http:
  method: GET
  url: https://uatmcdphcmplatform.omfysgroup.com/api/attendancepolicy/20
  headers:
    - name: Authorization
      value: bearer{{authToken}}
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{authToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
